<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a1a"/>
      <stop offset="1" stop-color="#e84a00"/>
    </linearGradient>
    <linearGradient id="door" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#ffd7a8"/>
    </linearGradient>
  </defs>
  <!-- rounded app tile -->
  <rect width="96" height="96" rx="22" fill="url(#bg)"/>
  <!-- vault body -->
  <circle cx="48" cy="52" r="26" fill="url(#door)"/>
  <circle cx="48" cy="52" r="26" fill="none" stroke="#fff" stroke-width="3" opacity="0.55"/>
  <!-- concentric vault rings -->
  <circle cx="48" cy="52" r="18" fill="none" stroke="#e84a00" stroke-width="2.5" opacity="0.85"/>
  <circle cx="48" cy="52" r="11" fill="none" stroke="#e84a00" stroke-width="2" opacity="0.7"/>
  <!-- dial / handle -->
  <circle cx="48" cy="52" r="5.5" fill="#e84a00"/>
  <rect x="46.2" y="36" width="3.6" height="10" rx="1.5" fill="#e84a00"/>
  <!-- vault hinge accents -->
  <circle cx="30" cy="40" r="2.2" fill="#fff" opacity="0.9"/>
  <circle cx="66" cy="40" r="2.2" fill="#fff" opacity="0.9"/>
  <circle cx="30" cy="64" r="2.2" fill="#fff" opacity="0.9"/>
  <circle cx="66" cy="64" r="2.2" fill="#fff" opacity="0.9"/>
</svg>
