<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title data-i18n="options_page_title">Artek Tab Vault settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <img src="../icons/icon.svg" alt="" class="logo" />
      <h1 data-i18n="options_heading">Artek Tab Vault — settings</h1>
    </header>

    <section class="card">
      <h2 data-i18n="heading_guardian">Guardian (auto memory discard)</h2>

      <label class="row">
        <span data-i18n="label_enable_guardian">Enable Guardian</span>
        <input type="checkbox" id="guardianEnabled" />
      </label>

      <label class="row">
        <span data-i18n="label_discard_after_idle">Discard tab after idle, min</span>
        <input type="number" id="idleMinutes" min="1" max="720" />
      </label>

      <label class="row">
        <span data-i18n="label_protect_forms">Do not discard tabs with unsaved forms</span>
        <input type="checkbox" id="protectUnsavedForms" />
      </label>

      <label class="row">
        <span data-i18n="label_smart_activation">Smart activation when closing a tab</span>
        <input type="checkbox" id="smartTabActivation" />
      </label>
      <small data-i18n="help_smart_activation"></small>

      <label class="row">
        <span data-i18n="label_mark_discarded">Mark discarded tabs with a title prefix</span>
        <input type="checkbox" id="markDiscardedInTitle" />
      </label>
      <label class="row">
        <span data-i18n="label_prefix_text">Prefix text</span>
        <input type="text" id="discardedTitlePrefix" maxlength="20" placeholder="💤 " />
      </label>
      <small data-i18n="help_mark_discarded"></small>

      <label class="block">
        <span data-i18n="label_whitelist">Never discard these domains (one per line)</span>
        <textarea id="whitelist" rows="5" placeholder="example.com&#10;mail.google.com"></textarea>
        <small data-i18n="help_whitelist"></small>
      </label>
    </section>

    <section class="card">
      <h2 data-i18n="heading_backup">Session backup</h2>

      <div class="row">
        <span data-i18n="label_presets">Ready-made retention profiles</span>
        <div class="btn-group">
          <button type="button" class="btn secondary preset-btn" data-preset="compact" data-i18n="preset_compact">Compact</button>
          <button type="button" class="btn secondary preset-btn" data-preset="balanced" data-i18n="preset_balanced">Balanced</button>
          <button type="button" class="btn secondary preset-btn" data-preset="archivist" data-i18n="preset_archivist">Archivist</button>
        </div>
      </div>
      <small data-i18n="help_presets"></small>

      <label class="row">
        <span data-i18n="label_backup_interval">Auto-backup interval, min</span>
        <input type="number" id="backupIntervalMinutes" min="0.5" max="60" step="0.5" />
      </label>

      <label class="row">
        <span data-i18n="label_max_snapshots">How many snapshots to keep (by count)</span>
        <input type="number" id="maxSnapshots" min="1" max="200" />
      </label>

      <label class="row">
        <span data-i18n="label_max_backup_mb">History size limit, MB (0 = no extra limit)</span>
        <input type="number" id="maxBackupMB" min="0" max="500" />
      </label>
      <small data-i18n="help_retention"></small>

      <div class="row">
        <span data-i18n="label_storage_used">Currently used by snapshots</span>
        <span id="storageUsage">-</span>
      </div>

      <div class="row">
        <span data-i18n="label_file_backup">File backup of snapshots</span>
        <div class="btn-group">
          <button id="exportBtn" class="btn secondary" data-i18n="btn_export">Export .json</button>
          <label class="btn secondary file-btn" id="importLabel">
            <span data-i18n="btn_import">Import file</span>
            <input type="file" id="importInput" accept="application/json,.txt" hidden />
          </label>
        </div>
      </div>
      <small data-i18n="help_import"></small>
    </section>

    <section class="card">
      <h2 data-i18n="heading_prune_log">Backup prune history</h2>
      <small data-i18n="help_prune_log"></small>
      <ul id="pruneLogList" class="prune-log"></ul>
    </section>

    <section class="card actions">
      <button id="saveBtn" class="btn" data-i18n="btn_save">Save</button>
      <button id="resetBtn" class="btn secondary" data-i18n="btn_reset">Reset to defaults</button>
      <span id="status" class="status"></span>
    </section>
  </div>

  <script src="../core.js"></script>
  <script src="../i18n.js"></script>
  <script src="../ui-feedback.js"></script>
  <script src="options.js"></script>
</body>
</html>
