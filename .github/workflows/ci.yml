name: CI

on:
  push:
    branches: [develop, prod, master]
  pull_request:
    branches: [develop, prod, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: web-ext lint
        run: npx web-ext lint --source-dir=.

      - name: Build extension zip
        run: npx web-ext build --source-dir=. --overwrite-dest

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-build
          path: web-ext-artifacts/*.zip
          retention-days: 14
