name: Release to AMO (listed)

# Fires only on pushes to prod - the branch that requires explicit human
# go-ahead before anything lands on it (see .cursor/rules/release-policy.mdc
# and .cursor/skills/release-prod/SKILL.md). CI itself never merges to prod;
# it only publishes what a human already approved and merged.
on:
  push:
    branches: [prod]
  # Manual retry after AMO API throttle windows (or if a push submit failed).
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: web-ext lint
        run: npx web-ext lint --source-dir=.

      - name: Sign and submit to AMO (listed channel)
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        # Listed AMO review is manual (hours–days). --approval-timeout=0 means:
        # succeed as soon as upload/validation finishes — do NOT poll for
        # reviewer approval (that was the old false-red CI failure). Also treat
        # "version already on AMO" as success so a re-run of the same tag
        # doesn't fail after the file is already on the server.
        run: |
          set +e
          out=$(npx web-ext sign --source-dir=. --channel=listed --amo-metadata=amo-metadata.json --approval-timeout=0 2>&1)
          code=$?
          printf '%s\n' "$out"
          if [ "$code" -eq 0 ]; then exit 0; fi
          if printf '%s\n' "$out" | grep -qiE 'already exists|Version already exists|Duplicate add-on ID|Approval: timeout'; then
            echo "AMO already has this upload (or approval wait skipped) — treating as success."
            exit 0
          fi
          exit "$code"

      - name: Upload signed xpi (only if approval already finished)
        uses: actions/upload-artifact@v4
        with:
          name: signed-xpi
          path: web-ext-artifacts/*.xpi
          retention-days: 90
          if-no-files-found: ignore
